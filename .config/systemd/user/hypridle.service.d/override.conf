# Override: give hypridle more restart tolerance at session start.
#
# At login, systemd can mark ConditionEnvironment=WAYLAND_DISPLAY satisfied
# (env imported) slightly before Hyprland's Wayland socket is actually
# listen-ready, so hypridle's first launch(es) fail with "Couldn't connect
# to a wayland compositor". The upstream unit's default burst (5 restarts /
# 10s, ~instant retries) exhausts before the socket comes up, landing the
# service in a permanent 'failed (start-limit-hit)' state for the rest of
# the session — no lock/DPMS-off/suspend timeouts fire until it's manually
# reset. Widen the window and space out retries so it survives the race.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
RestartSec=2
