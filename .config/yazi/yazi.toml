# yazi.toml
[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true

[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "Edit" },
]
doxx = [
  { run = 'doxx %s', desc = "doxx", block = true },
]
xleak = [
  { run = 'xleak -i %s', desc = "xleak", block = true },
]
open = [
  { run = 'xdg-open %s', desc = "Open" },
]
image = [
  { run = 'swayimg %s', desc = "swayimg", block = false, orphan = true },
]
pdf = [
  { run = 'zathura %s', desc = "zathura", orphan = true, for = "unix" },
]
trash = [
  { run = 'gio trash %s', desc = "Trash" },
]

[open]
rules = [
  # Text and Code
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },
  
  # Media
  { mime = "image/*", use = "image" },
  { url = "*.pdf", use = "pdf" },
  { mime = "application/pdf", use = "pdf" },
  
  # Office
  { url = "*.docx", use = "doxx" },
  { url = "*.xlsx", use = [ "xleak", "open" ] },
  { url = "*.xlsm", use = [ "xleak", "open" ] },
  { url = "*.xls",  use = [ "xleak", "open" ] },
  { url = "*.ods",  use = [ "xleak", "open" ] },
  
  # Fallback
  { url = "*", use = [ "edit", "open" ] },
]

[preview]
tab_size   = 2
max_width  = 1000
max_height = 1000
cache_dir  = "~/.cache/yazi"

[tasks]
micro_workers    = 5
macro_workers    = 10
biv_workers      = 5
suppress_confirm = false

[plugin]
prepend_previewers = [
  { url = "*.docx", run = "doxx" },
  { url = "*.xlsx", run = "xleak" },
  { url = "*.xlsm", run = "xleak" },
  { url = "*.xls",  run = "xleak" },
  { url = "*.ods",  run = "xleak" },
]
