[main]
font=JetBrainsMono Nerd Font:size=10.5
shell=/usr/bin/zsh
term=foot
include=~/.config/foot/kanagawa.ini

# Mirror ghostty's keybinds (.config/ghostty/config) where foot has an
# equivalent action. Foot has no tabs/splits/window-management concept
# like ghostty, so those binds (new_tab, new_split, goto_split, etc.)
# have no equivalent here and are left out.
[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
search-start=Control+Shift+f
spawn-terminal=Control+Shift+n
fullscreen=Control+Return
scrollback-home=Shift+Home
scrollback-end=Shift+End
