# =======================
# Hyprlock Configuration
# =======================

# ----- Fonts -----
$font         = JetBrainsMono Nerd Font
$font-display = JetBrainsMono Nerd Font

# ----- Catppuccin Mocha Palette -----
$color-accent = rgb(126,156,216)   # Blue
$color-check  = rgb(152,187,108)   # Green
$color-fail   = rgb(228,104,118)   # Red
$color-inner  = rgba(30,30,46,0.6) # Base w/ transparency
$color-font   = rgb(220,215,186)   # Text
$color-subtle = rgb(84,84,109)   # Overlay0 (for dim accents)
$color-lavender = rgb(137,146,178) # Lavender
$color-mauve  = rgb(149,127,184)   # Mauve

# ----------- General -----------
general {
  hide_cursor = false
  grace = 0
  disable_loading_bar = false
}

# -------- Animations -----------
animations {
  enabled = true
  bezier = smooth, 0.4, 0.02, 0.21, 1   # custom smoother curve
  animation = fadeIn,        1, 6, smooth
  animation = fadeOut,       1, 6, smooth
  animation = inputFieldDots,1, 4, smooth
}

# -------- Background -----------
background {
  path = screenshot
  blur_passes = 4              # slightly stronger blur
  blur_size   = 8              # cleaner background blur
  noise       = 0.02           # subtle dithering for less banding
}

# ------- Profile Picture -------
image {
  path = ~/.face                # or use a specific path like ~/Pictures/avatar.png
  size = 120
  rounding = -1                 # -1 = circle
  border_size = 3
  border_color = $color-accent
  
  position = 0, 120
  halign = center
  valign = center
}

# ------- User Greeting -------
label {
  text = Hi, $USER
  color = $color-font
  font_size = 28
  font_family = $font-display
  
  position = 0, 40
  halign = center
  valign = center
}

# ------- Input Field -----------
input-field {
  size = 300, 50
  outline_thickness = 2
  rounding = 12

  inner_color = $color-inner
  outer_color = $color-accent $color-check 45deg
  check_color = $color-check $color-accent 120deg
  fail_color  = $color-fail rgba(250,179,135,0.9) 40deg  # Red → Peach gradient
  font_color  = $color-font

  shadow_color = rgba(0,0,0,0.4)
  shadow_size = 6
  fade_on_empty = true          # looks cleaner
  fade_timeout = 1000
  font_family   = $font
  placeholder_text =  Enter password...
  fail_text       =  $FAIL ($ATTEMPTS)

  dots_spacing = 0.35
  dots_size    = 0.4
  dots_center = true

  position = 0, -60
  halign = center
  valign = center
}

# ------- Time Display -------
label {
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = $color-font
  font_size = 90
  font_family = $font-display
  ignore_empty = true
  
  position = 0, 300
  halign = center
  valign = center
}

# ------- Date Display -------
label {
  text = cmd[update:300000] echo "$(date +"%A, %B %d")"
  color = $color-lavender
  font_size = 22
  font_family = $font
  ignore_empty = true
  
  position = 0, 200
  halign = center
  valign = center
}

# ------- Battery Status (bottom-right) -------
label {
  text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1)%"
  color = $color-lavender
  font_size = 14
  font_family = $font
  ignore_empty = true
  
  position = -30, 30
  halign = right
  valign = bottom
}

# ------- Uptime (bottom-left) -------
label {
  text = cmd[update:60000] echo "󱎫 $(uptime -p | sed 's/up //')"
  color = $color-lavender
  font_size = 14
  font_family = $font
  ignore_empty = true
  
  position = 30, 30
  halign = left
  valign = bottom
}

# ------- Caps Lock Indicator -------
label {
  text = cmd[update:500] ~/.config/hypr/scripts/capslock.sh
  color = $color-mauve
  font_size = 16
  font_family = $font
  ignore_empty = true
  
  position = 0, -140
  halign = center
  valign = center
}
