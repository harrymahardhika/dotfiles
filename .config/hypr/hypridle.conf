general {
    # Switched from hyprlock to swaylock (2026-09-14): hyprlock has a
    # recurring, unresolved bug where its session-lock handshake with
    # Hyprland ("onLockFinished called. Seems we got yeeten.") gets stuck
    # around suspend/resume, wedging the display and forcing a reboot.
    # swaylock uses the same ext-session-lock-v1 protocol but is a separate
    # codebase without that bug. See memory: hypr-suspend-resume-crash.
    #
    # Still terminate any existing instance before relaunching — cheap
    # insurance against a stuck lock surface — using plain SIGTERM so it
    # can release cleanly rather than being SIGKILLed mid-render.
    lock_cmd = pkill swaylock 2>/dev/null; $HOME/.config/hypr/swaylock.sh
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ; pkill swaylock 2>/dev/null; $HOME/.config/hypr/swaylock.sh    # wake panel, then lock before suspend.
    # hypr-unstick.sh auto-clears a stuck crashed-lockscreen state if the
    # lock handshake got wedged on resume; no-op when nothing is stuck.
    # It does NOT fix the separate aquamarine DRM segfault-on-teardown bug
    # (see memory: hypr-suspend-resume-crash) — that still needs a reboot.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ; $HOME/scripts/hypr-unstick.sh
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 630                                                     # 10.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = $HOME/.config/hypr/lock-and-suspend.sh
}
