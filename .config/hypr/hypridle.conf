general {
    # Lock path: logind/idle/lid events funnel through lock_cmd. Suspend
    # waits for the session to report actually locked (inhibit_sleep=3 via
    # hyprland-lock-notify-v1) instead of racing hyprlock's startup against
    # DRM teardown — the same-second lid-close suspend used to birth hyprlock
    # with no time to present a frame ("Seems we got yeeten").
    # See: hyprwm/hyprlock#101, hyprwm/hyprlock#633.
    #
    # Deliberately no `pkill hyprlock` here: killing the locker at sleep
    # time murders even healthy locks and manufactures the very wedge
    # hypr-unstick.sh has to clean up. `pidof ||` guards duplicates.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # hypr-unstick.sh clears a stuck crashed-lockscreen state if the lock
    # handshake still wedged; no-op when healthy (locked or not).
    # It does NOT fix the separate aquamarine DRM segfault-on-teardown bug
    # (see env-hyprland AQ_NO_ATOMIC) — that still needs a reboot.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ; $HOME/scripts/hypr-unstick.sh
    inhibit_sleep = 3
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 630                                                     # 10.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = $HOME/.config/hypr/lock-and-suspend.sh
}
