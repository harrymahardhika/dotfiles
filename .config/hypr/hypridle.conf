general {
    # `pidof hyprlock || hyprlock` used to skip relaunching if a hyprlock
    # process was already alive. But hyprlock can lose its lock surface
    # (e.g. an output re-init around suspend/DPMS) while the process itself
    # lingers idle in the background — pidof then finds this zombie forever
    # and never locks again. Always kill any existing instance and start
    # fresh instead; hyprlock startup is cheap.
    lock_cmd = pkill -9 hyprlock 2>/dev/null; exec hyprlock
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ; pkill -9 hyprlock 2>/dev/null; exec hyprlock    # wake panel, then lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 630                                                     # 10.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = $HOME/.config/hypr/lock-and-suspend.sh
}
