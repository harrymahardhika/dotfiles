tmux:
  symbols:
    branch: ' '
    hashprefix: ':'
    ahead: ' '
    behind: ' '
    staged: '󱤧 '
    conflict: ' '
    modified: '󰛿 '
    untracked: ' '
    stashed: '󰈿 '
    clean: ' '
    insertions: ' '
    deletions: ' '
    styles:
      clear: '#[fg=default]'
      state: '#[fg=#e46876]'
      branch: '#[fg=#dcd7ba]'
      remote: '#[fg=#7aa89f]'
      divergence: '#[fg=#dcd7ba]'
      staged: '#[fg=#98bb6c]'
      conflict: '#[fg=#e46876]'
      modified: '#[fg=#ffa066]'
      untracked: '#[fg=#957fb8]'
      stashed: '#[fg=#7aa89f]'
      clean: '#[fg=#98bb6c]'
      insertions: '#[fg=#98bb6c]'
      deletions: '#[fg=#e46876]'
  layout: [branch, divergence, stats, flags]
  options:
    branch_max_len: 0
    branch_trim: right
    ellipsis: …
    hide_clean: false
    swap_divergence: false
    divergence_space: false
